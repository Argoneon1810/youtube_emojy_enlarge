<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 160px;
      padding: 12px;
      margin: 0;
      background-color: #f9f9f9;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    h3 {
      margin: 0;
      font-size: 13px;
      color: #0f0f0f;
    }
    button {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
      transition: background 0.2s;
    }
    .slider-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .slider-container label {
      font-size: 11px;
      color: #606060;
      text-align: center;
    }
    input[type="range"] {
      width: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h3>이모지 탭 크기</h3>
    <button id="toggleBtn">기본 모드 (OFF)</button>
    <div class="slider-container">
      <label for="heightSlider">높이: <span id="heightValue">520</span>px</label>
      <input type="range" id="heightSlider" min="200" max="880" value="520" step="10">
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
